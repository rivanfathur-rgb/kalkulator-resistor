<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator Kode Warna Resistor</title>
<meta name="description" content="Kalkulator resistor 3, 4, 5, dan 6 gelang. Pilih warna tiap gelang, lihat nilai hambatan dan toleransinya.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5f6b7a;--bd:#dde1e6;--acc:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--tx:#e8ecf1;--mut:#9aa7b6;--bd:#2a323d;--acc:#60a5fa}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 8px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1}
#fig svg{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px}
rect[data-k]{cursor:pointer}
.res{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:12px 0}
.val{font-size:2rem;font-weight:700}
.sub{color:var(--mut);font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{display:flex;align-items:center;gap:6px;padding:8px 10px}
.sw{width:16px;height:16px;border-radius:50%;border:1px solid #0006;display:inline-block;flex:none}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pal button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px}
.pal .sw{width:28px;height:28px}
.pal small{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Kalkulator Resistor</h1>
<div class="seg" id="modes" role="group" aria-label="Jumlah gelang"></div>
<div id="fig"></div>
<section class="res" id="res" aria-live="polite"></section>
<div class="tabs" id="tabs" role="group" aria-label="Pilih gelang"></div>
<div class="pal" id="pal" role="group" aria-label="Pilih warna"></div>
</main>
<script>
const COL = {
  black:['Hitam','#111111'], brown:['Coklat','#7b3f12'], red:['Merah','#d62828'],
  orange:['Oranye','#f77f00'], yellow:['Kuning','#fcd90a'], green:['Hijau','#2a9d3b'],
  blue:['Biru','#1d4ed8'], violet:['Ungu','#7e22ce'], grey:['Abu-abu','#8d8d8d'],
  white:['Putih','#f5f5f5'], gold:['Emas','#cfa937'], silver:['Perak','#c0c0c0']
};
const DIG = ['black','brown','red','orange','yellow','green','blue','violet','grey','white'];
const MUL = DIG.concat(['gold','silver']);
const TOL = {brown:1,red:2,green:0.5,blue:0.25,violet:0.1,grey:0.05,gold:5,silver:10};
const TCR = {black:250,brown:100,red:50,orange:15,yellow:25,green:20,blue:10,violet:5,grey:1};
const LAYOUT = {
  3:['d1','d2','mult'],
  4:['d1','d2','mult','tol'],
  5:['d1','d2','d3','mult','tol'],
  6:['d1','d2','d3','mult','tol','tcr']
};
const st = {mode:4, sel:'d1', c:{d1:'brown',d2:'black',d3:'black',mult:'red',tol:'gold',tcr:'brown'}};

const $ = id => document.getElementById(id);
const clean = x => String(parseFloat(x.toPrecision(10))).replace('.', ',');
function si(v){
  for (const [s,p] of [[1e9,'G'],[1e6,'M'],[1e3,'k']]) if (v >= s) return clean(v/s) + ' ' + p;
  return clean(v) + ' ';
}
const ohm = v => si(v) + 'Ω';
const mulVal = c => c === 'gold' ? 0.1 : c === 'silver' ? 0.01 : Math.pow(10, DIG.indexOf(c));
const options = k => k[0] === 'd' ? DIG : k === 'mult' ? MUL : Object.keys(k === 'tol' ? TOL : TCR);
function hint(k, c){
  if (k[0] === 'd') return String(DIG.indexOf(c));
  if (k === 'mult') return '×' + si(mulVal(c)).trim();
  if (k === 'tol') return '±' + clean(TOL[c]) + '%';
  return TCR[c] + ' ppm';
}

function figure(L){
  const names = L.map(k => COL[st.c[k]][0]).join(', ');
  const pos = (k,i) => k === 'tol' ? (st.mode === 6 ? 236 : 250) : k === 'tcr' ? 264 : 92 + i*32;
  let bands = '', mark = '';
  L.forEach((k,i) => {
    const x = pos(k,i);
    bands += `<rect data-k="${k}" x="${x}" y="18" width="16" height="74" fill="${COL[st.c[k]][1]}"/>`;
    if (k === st.sel) mark = `<rect x="${x-3}" y="14" width="22" height="82" rx="4" fill="none" stroke="var(--acc)" stroke-width="2.5" pointer-events="none"/>`;
  });
  return `<svg viewBox="0 0 360 110" role="img" aria-label="Resistor ${st.mode} gelang: ${names}">
<line x1="6" y1="55" x2="354" y2="55" stroke="#9aa0a6" stroke-width="5" stroke-linecap="round"/>
<clipPath id="cp"><rect x="62" y="20" width="236" height="70" rx="30"/></clipPath>
<rect x="62" y="20" width="236" height="70" rx="30" fill="#e3c99a"/>
<g clip-path="url(#cp)">${bands}</g>${mark}</svg>`;
}

function result(L){
  const c = st.c;
  const digits = L.filter(k => k[0] === 'd').map(k => DIG.indexOf(c[k])).join('');
  const v = parseInt(digits, 10) * mulVal(c.mult);
  const tol = st.mode === 3 ? 20 : TOL[c.tol];
  const lo = v * (1 - tol/100), hi = v * (1 + tol/100);
  let h = `<div class="val">${ohm(v)}</div>
<div class="sub">Toleransi ±${clean(tol)}%${st.mode === 3 ? ' (3 gelang tidak punya gelang toleransi)' : ''}</div>
<div class="sub">Rentang: ${ohm(lo)} – ${ohm(hi)}</div>`;
  if (st.mode === 6) h += `<div class="sub">Koefisien suhu: ${TCR[c.tcr]} ppm/°C</div>`;
  return h;
}

function render(){
  const L = LAYOUT[st.mode];
  if (!L.includes(st.sel)) st.sel = L[0];
  $('modes').innerHTML = [3,4,5,6].map(n =>
    `<button data-mode="${n}" aria-pressed="${n === st.mode}">${n} gelang</button>`).join('');
  $('fig').innerHTML = figure(L);
  $('res').innerHTML = result(L);
  $('tabs').innerHTML = L.map((k,i) =>
    `<button data-k="${k}" aria-pressed="${k === st.sel}"><span class="sw" style="background:${COL[st.c[k]][1]}"></span>Gelang ${i+1}</button>`).join('');
  $('pal').innerHTML = options(st.sel).map(c =>
    `<button data-c="${c}" aria-pressed="${st.c[st.sel] === c}"><span class="sw" style="background:${COL[c][1]}"></span>${COL[c][0]}<small>${hint(st.sel, c)}</small></button>`).join('');
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-mode],[data-k],[data-c]');
  if (!b) return;
  if (b.dataset.mode) st.mode = +b.dataset.mode;
  else if (b.dataset.k) st.sel = b.dataset.k;
  else st.c[st.sel] = b.dataset.c;
  render();
});
render();
</script>
</body>
</html>
